version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: jobsearcher-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: jobsearcher
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

    backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: jobsearcher-backend
      ports:
        - "8500:8000"
      depends_on:
        mongodb:
          condition: service_healthy
      environment:
        - MONGODB_URL=mongodb://admin:admin123@mongodb:27017/jobsearcher
      volumes:
        - ./backend:/app
        - ./backend/.venv:/app/.venv
      command: python main.py
      healthcheck:
        test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8000/health'); exit(0 if r.status_code == 200 else 1)"]
        interval: 10s
        timeout: 5s
        retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobsearcher-frontend
    ports:
      - "8501:4200"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_URL=http://backend:8000
    command: ng serve --host 0.0.0.0 --disable-host-check

volumes:
  mongo_data:
