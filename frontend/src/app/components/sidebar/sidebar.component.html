<aside class="fixed left-0 top-0 h-full p-lg flex flex-col gap-md bg-surface-container-low w-[280px] hidden md:flex z-40 pt-[72px]">
  <div class="mb-lg px-md">
    <h2 class="text-headline-md text-primary font-bold">Navigation</h2>
    <p class="text-label-md text-on-surface-variant">Manage your career</p>
  </div>
  <nav class="flex flex-col gap-sm flex-1">
    <a class="flex items-center gap-md px-md py-sm rounded-xl transition-all cursor-pointer" [class.bg-primary-container]="activeItem === 'all-jobs'" [class.text-on-primary-container]="activeItem === 'all-jobs'" [class.text-on-surface-variant]="activeItem !== 'all-jobs'" [class.hover:bg-surface-variant]="activeItem !== 'all-jobs'" (click)="showAllJobs()">
      <span class="material-symbols-outlined">work</span>
      <span class="text-label-md">All Jobs</span>
    </a>
    <a class="flex items-center gap-md px-md py-sm rounded-xl transition-all cursor-pointer" [class.bg-primary-container]="activeItem === 'applicable'" [class.text-on-primary-container]="activeItem === 'applicable'" [class.text-on-surface-variant]="activeItem !== 'applicable'" [class.hover:bg-surface-variant]="activeItem !== 'applicable'" (click)="showApplicable()">
      <span class="material-symbols-outlined">check_circle</span>
      <span class="text-label-md">Applicable Jobs</span>
    </a>

  </nav>
</aside>
