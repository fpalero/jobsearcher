<div class="group relative bg-white rounded-xl p-lg border border-transparent transition-all duration-300 hover:shadow-[0px_4px_20px_rgba(15,23,42,0.05)] hover:border-primary cursor-pointer"
     [style.transform]="isHovered ? 'translateY(-2px)' : 'translateY(0)'"
     (mouseenter)="isHovered = true"
     (mouseleave)="isHovered = false"
     (click)="viewDetails.emit(job)">
  <div class="flex justify-between items-start gap-lg">
    <div class="flex-1 flex gap-lg">
      <div class="w-14 h-14 rounded-xl bg-surface-container flex items-center justify-center overflow-hidden flex-shrink-0">
        <img [src]="job.logoUrl" alt="Company Logo" class="w-10 h-10 object-contain" (error)="logoError = true" [class.hidden]="logoError">
        @if (logoError) {
          <span class="text-headline-md text-on-surface-variant font-bold">{{ job.company.charAt(0) }}</span>
        }
      </div>
      <div class="space-y-xs flex-1">
        <div class="flex items-center gap-sm">
          <p class="text-label-md text-on-surface-variant">{{ job.company }}</p>
          @if (job.applied) {
            <span class="px-sm py-0.5 bg-secondary-container text-on-secondary-container text-label-md rounded-full font-semibold">Applied</span>
          }
        </div>
        <h3 class="text-headline-md text-on-surface group-hover:text-primary transition-colors">{{ job.title }}</h3>
        <div class="flex items-center gap-md text-on-surface-variant text-body-md">
          <span class="flex items-center gap-xs">
            <span class="material-symbols-outlined text-[18px]">location_on</span>
            {{ job.location }}
          </span>
          <span class="flex items-center gap-xs">
            <span class="material-symbols-outlined text-[18px]">payments</span>
            {{ job.salary }}
          </span>
        </div>
      </div>
    </div>
    <div class="flex flex-col gap-sm mr-md self-center">
      <button class="flex items-center justify-center gap-xs px-md py-sm bg-primary-container text-on-primary-container rounded-xl font-bold transition-colors text-label-md whitespace-nowrap" (click)="generateCV($event)" [class.opacity-50]="generatingCV" [class.cursor-not-allowed]="generatingCV" [disabled]="generatingCV">
        @if (generatingCV) {
          <span class="inline-block w-4 h-4 border-2 border-on-primary-container border-t-transparent rounded-full animate-spin"></span>
        } @else {
          <span class="material-symbols-outlined text-[18px]">history_edu</span>
        }
        {{ generatingCV ? 'Generating...' : 'Generate CV' }}
      </button>
      <button class="flex items-center justify-center gap-xs px-md py-sm border border-primary text-primary hover:bg-surface-variant rounded-xl font-bold transition-colors text-label-md whitespace-nowrap" (click)="generateCoverLetter($event)" [class.opacity-50]="generatingCoverLetter" [class.cursor-not-allowed]="generatingCoverLetter" [disabled]="generatingCoverLetter">
        @if (generatingCoverLetter) {
          <span class="inline-block w-4 h-4 border-2 border-primary border-t-transparent rounded-full animate-spin"></span>
        } @else {
          <span class="material-symbols-outlined text-[18px]">description</span>
        }
        {{ generatingCoverLetter ? '...' : 'Cover Letter' }}
      </button>
      <button class="flex items-center justify-center gap-xs px-md py-sm bg-primary text-on-primary rounded-xl font-bold transition-colors text-label-md transition-all duration-300" (click)="openApplyLink($event)">
        Apply Now <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </button>
    </div>
    <div class="flex flex-col items-center gap-sm">
      <div class="flex items-center gap-xs">
        <button class="p-xs hover:text-primary transition-colors" (click)="toggleSave($event)" title="Save job">
          <span class="material-symbols-outlined" [class.filled]="job.saved" [style.font-variation-settings]="job.saved ? 'FILL 1' : 'FILL 0'" [class.text-primary]="job.saved">bookmark</span>
        </button>
        <button class="p-xs hover:text-secondary transition-colors" (click)="toggleApplied($event)" [title]="job.applied ? 'Unmark as applied' : 'Mark as applied'">
          <span class="material-symbols-outlined text-[20px]" [class.filled]="job.applied" [style.font-variation-settings]="job.applied ? 'FILL 1' : 'FILL 0'" [class.text-secondary]="job.applied">check_circle</span>
        </button>
      </div>
      <div class="relative w-16 h-16">
        <svg class="match-ring w-16 h-16" viewBox="0 0 64 64">
          <circle class="text-surface-container" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor" stroke-width="4"/>
          <circle class="text-secondary" cx="32" cy="32" fill="transparent" r="28" stroke="currentColor"
                  stroke-dasharray="175.9" [attr.stroke-dashoffset]="matchOffset" stroke-width="4"/>
        </svg>
        <div class="absolute inset-0 flex items-center justify-center">
          <span class="text-data-mono text-secondary text-[14px]">{{ job.matchPercentage }}%</span>
        </div>
      </div>
      <span class="text-label-md text-secondary mt-xs uppercase tracking-wider">Match</span>
      <div class="flex items-center gap-sm mt-sm">
        <button class="p-xs hover:bg-secondary-container rounded-full transition-colors" (click)="ratePositive($event)" title="Accurate match">
          <span class="material-symbols-outlined text-on-surface-variant" [class.thumb-active-up]="job.feedback === 'positive'">thumb_up</span>
        </button>
        <button class="p-xs hover:bg-error-container rounded-full transition-colors" (click)="rateNegative($event)" title="Inaccurate match">
          <span class="material-symbols-outlined text-on-surface-variant" [class.thumb-active-down]="job.feedback === 'negative'">thumb_down</span>
        </button>
      </div>
    </div>
  </div>
  <div class="mt-md">
    <p class="text-body-md text-on-surface-variant line-clamp-2">{{ job.description }}</p>
  </div>
  <div class="mt-md flex flex-wrap gap-sm">
    @for (tag of job.tags; track tag) {
      <span class="px-md py-xs bg-surface-container rounded-full text-on-surface-variant text-label-md">{{ tag }}</span>
    }
  </div>
</div>
